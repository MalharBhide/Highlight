name: Validate Highlight
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          HIGHLIGHT_TEST_SERVER: dist-server/server.js
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
      - run: docker build -t highlight:test .
      - run: npm run test:docker
      - run: npm run test:docker
        env:
          HIGHLIGHT_TEST_FREE_DEMO: "true"
