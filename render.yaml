services:
  - type: web
    name: highlight
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: FREE_DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: STORAGE_DIR
        value: /app/storage
      - key: ALLOW_HEURISTIC_FALLBACK
        value: "false"
